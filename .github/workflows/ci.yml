name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Run tests
        run: uv run pytest

      - name: Compile Python files
        run: uv run python -m compileall app ui tests

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: memento-notes-app
          path: |
            app/
            ui/
            tests/
            .env.example
            .gitignore
            pytest.ini
            README.md
            requirements.txt
